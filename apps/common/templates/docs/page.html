<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ page_title }} · Docs</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      min-height: 100vh;
      background: canvas;
      color: canvastext;
    }
    nav {
      width: 260px;
      flex-shrink: 0;
      padding: 24px 16px;
      border-right: 1px solid rgba(128, 128, 128, 0.3);
      overflow-y: auto;
    }
    nav h1 { font-size: 15px; margin: 0 0 16px; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.04em; }
    nav ul { list-style: none; margin: 0 0 20px; padding: 0; }
    nav li { margin: 2px 0; }
    nav a {
      display: block;
      padding: 6px 10px;
      border-radius: 6px;
      color: inherit;
      text-decoration: none;
      font-size: 14px;
    }
    nav a:hover { background: rgba(128, 128, 128, 0.15); }
    nav a.active { background: rgba(99, 102, 241, 0.18); font-weight: 600; }
    main {
      flex: 1;
      max-width: 860px;
      padding: 40px 48px;
      overflow-x: auto;
    }
    main h1:first-child { margin-top: 0; }
    main pre {
      background: rgba(128, 128, 128, 0.12);
      padding: 12px 16px;
      border-radius: 8px;
      overflow-x: auto;
    }
    main code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
    main pre code { font-size: 0.85em; }
    main table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    main th, main td { border: 1px solid rgba(128, 128, 128, 0.3); padding: 6px 10px; text-align: left; }
    main blockquote { border-left: 3px solid rgba(128, 128, 128, 0.4); margin: 0; padding-left: 16px; opacity: 0.85; }
    main a { color: #6366f1; }
  </style>
</head>
<body>
  <nav>
    <h1>Docs internas</h1>
    <ul>
      <li><a href="{% url 'docs-index' %}" class="{% if active_slug == 'index' %}active{% endif %}">Inicio</a></li>
      <li><a href="{% url 'docs-changelog' %}" class="{% if active_slug == 'changelog' %}active{% endif %}">Changelog</a></li>
    </ul>
    <h1>Apps</h1>
    <ul>
      {% for page in pages %}
        <li><a href="{% url 'docs-page' slug=page.slug %}" class="{% if active_slug == page.slug %}active{% endif %}">{{ page.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
  <main>
    {{ content_html|safe }}
  </main>
</body>
</html>

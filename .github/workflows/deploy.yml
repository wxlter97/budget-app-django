name: Deploy

# Redeploy del backend a Cloud Run en cada push a main (después del merge de un PR).
# Requiere haber corrido una vez `bash scripts/setup-gh-deploy.sh` y guardado
# las variables WIF_PROVIDER y DEPLOY_SA en el repo (Settings → Actions → Variables).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # `--source .` reconstruye la imagen vía Cloud Build. No se pasan env vars
      # ni secrets: `gcloud run deploy` conserva los que ya tiene el servicio
      # (incluido CORS_ALLOWED_ORIGINS).
      #
      # `--no-traffic`: la revisión nueva queda creada pero sin servir a nadie
      # hasta que las migraciones hayan corrido (paso de abajo). Mientras el
      # servicio tenga RUN_MIGRATIONS=1 (el valor por defecto) el contenedor
      # también migra al arrancar y todo sigue como antes.
      - name: Deploy to Cloud Run (sin tráfico)
        run: |
          gcloud run deploy budget-api \
            --project budget-wxlter \
            --region us-east1 \
            --source . \
            --no-traffic \
            --quiet

      # Migrar con un job aparte y no al arrancar el contenedor saca la carrera
      # entre instancias y acelera el arranque en frío (DEPLOY.md §2.2). Usa la
      # imagen de la revisión que acaba de crearse, así el esquema y el código
      # que va a servir salen del mismo commit.
      #
      # Si el job no existe se omite: entonces migra el arranque del contenedor.
      # Si la migración falla, el paso falla y el tráfico NO se mueve: sigue
      # sirviendo la revisión anterior. `--wait` devuelve error si el job falla.
      - name: Migrar la base (budget-migrate)
        run: |
          if ! gcloud run jobs describe budget-migrate --project budget-wxlter --region us-east1 >/dev/null 2>&1; then
            echo "budget-migrate no existe, se omite (migra el arranque del contenedor)"
            exit 0
          fi
          REV=$(gcloud run services describe budget-api --project budget-wxlter --region us-east1 \
            --format='value(status.latestCreatedRevisionName)')
          IMAGE=$(gcloud run revisions describe "$REV" --project budget-wxlter --region us-east1 \
            --format='value(spec.containers[0].image)')
          if [ -z "$IMAGE" ]; then
            echo "No se pudo leer la imagen de la revisión $REV"; exit 1
          fi
          echo "migrando con: $IMAGE"
          gcloud run jobs update budget-migrate --project budget-wxlter --region us-east1 --image "$IMAGE"
          gcloud run jobs execute budget-migrate --project budget-wxlter --region us-east1 --wait

      - name: Pasar el tráfico a la revisión nueva
        run: |
          gcloud run services update-traffic budget-api \
            --project budget-wxlter \
            --region us-east1 \
            --to-latest

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe budget-api --project budget-wxlter --region us-east1 --format='value(status.url)')
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/healthz/") || true
            [ "$code" = "200" ] && { echo "healthz OK"; exit 0; }
            echo "intento $i: $code"; sleep 6
          done
          echo "healthz no respondió 200"; exit 1

      # Los Cloud Run Jobs NO se redespliegan solos: este workflow sólo tocaba
      # el servicio, así que la imagen de los jobs quedaba congelada en la del
      # día que se crearon. La base, en cambio, sigue migrando en cada arranque
      # del servicio -- y en cuanto una migración borra una columna, el job
      # empieza a fallar contra un esquema que ya no es el suyo. Fue
      # exactamente lo que pasó: `budget-cron` venía fallando desde el 13 sep
      # con "column transactions_categorybudget.month does not exist", seis
      # días sin recurrentes, sin cierres y sin recordatorios, sin que nada
      # avisara.
      #
      # Se reutiliza la imagen que acaba de quedar en el servicio en vez de
      # construir otra: es el mismo commit, y así no hay forma de que el job y
      # el servicio corran código distinto.
      #
      # Va después del smoke test a propósito: si el servicio nuevo no levanta,
      # esa imagen tampoco tiene por qué llegar al job.
      - name: Sincronizar la imagen de los jobs
        run: |
          IMAGE=$(gcloud run services describe budget-api \
            --project budget-wxlter --region us-east1 \
            --format='value(spec.template.spec.containers[0].image)')
          if [ -z "$IMAGE" ]; then
            echo "No se pudo leer la imagen del servicio"; exit 1
          fi
          echo "imagen: $IMAGE"
          for JOB in budget-cron budget-migrate; do
            if gcloud run jobs describe "$JOB" --project budget-wxlter --region us-east1 >/dev/null 2>&1; then
              gcloud run jobs update "$JOB" --project budget-wxlter --region us-east1 --image "$IMAGE"
              echo "actualizado: $JOB"
            else
              echo "no existe, se omite: $JOB"
            fi
          done

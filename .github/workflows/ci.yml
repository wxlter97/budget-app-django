name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buddyclone
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      DJANGO_SECRET_KEY: ci-secret-key-not-used-anywhere
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/buddyclone
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run

      - name: Esquema OpenAPI válido
        run: python manage.py spectacular --file /dev/null --validate

      - name: Tests
        run: python manage.py test --verbosity 2

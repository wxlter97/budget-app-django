x-django-env: &django-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
  DATABASE_URL: postgres://buddyclone:buddyclone@db:5432/buddyclone
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CACHE_URL: redis://redis:6379/2
  INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-inbound.buddyclone.local}
  INBOUND_WEBHOOK_SECRET: ${INBOUND_WEBHOOK_SECRET:-}

x-app: &app
  build: .
  environment: *django-env

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: buddyclone
      POSTGRES_PASSWORD: buddyclone
      POSTGRES_DB: buddyclone
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddyclone"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Corre las migraciones una vez y termina; el resto de servicios espera a que
  # complete con éxito (evita la carrera de arranque).
  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: celery -A config worker -l info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *app
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  db_data:
